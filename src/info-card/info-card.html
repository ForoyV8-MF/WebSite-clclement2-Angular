<!-- | safeHtml -->

<div class="info-card">

    <div class="info-card-content">
        <div class="info-card-banner">
            <div class="info-card-title"> <div>{{title}}</div> </div>
        </div>
    </div>

    <div class="info-card-content-wrapper" style="align-items: center;">

        <div>
            <img class="info-card-image-format" src="{{ ImagePath }}" alt="{{ ALT }}">
            <figcaption>{{ Caption }}</figcaption>
        </div>

        <div class="info-card-text-format">
            [innerHTML]="Text | safeHtml"
        </div>

    </div>

</div>
